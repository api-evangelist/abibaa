aid: abibaa
name: Abibaa
description: 'Abibaa was a global online B2B/B2C/C2C e-marketplace headquartered in
  North Brunswick, New Jersey, founded around 2011-2012 and led by Benjamin Koufie
  Akomeah, built to help small and medium-sized businesses trade across borders through
  a multi-language buyer-and-seller marketplace. It was surfaced through the API Evangelist
  harvest backlog from a secondary-market (EquityZen) pre-IPO listing. As of the 2026-09-06
  enrichment pass the company has no live web presence: abibaa.com is registered to
  the domain reseller TurnCommerce/NameBright and serves a HugeDomains "this domain
  is for sale" page, the Internet Archive holds no capture of a working site after
  March 2022, and no alternate company domain resolves. No API, developer program,
  documentation or machine-readable contract of any kind was found.'
